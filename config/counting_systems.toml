# Zählsysteme: Kartenwerte und Einstellungen.
# Die Werte stehen bewusst hier und nicht im Code, damit sie sich ohne Programmieren
# ändern oder um weitere Systeme ergänzen lassen.
#
# values:        Zählwert pro Rang ("10" steht für 10, B/J, D/Q und K)
# balanced:      true = Summe über ein Deck ist 0 → True Count = Running Count / Restdecks
#                false = unausgeglichen (KO) → feste Schwellen auf den Running Count
# level:         grösster Betrag eines Kartenwerts (nur zur Information)
# index_factor:  optional. Umrechnung Hi-Lo-Index → Index dieses Systems. Ohne Angabe wird
#                der Faktor automatisch berechnet: Regressionskoeffizient der Kartenwerte
#                gegenüber Hi-Lo (z. B. Zen ≈ 1.7). Das ist eine Näherung (siehe CHANGELOG).
# ace_side_count:true = Asse werden separat gezählt (Ass-Nebenzähler)
# ace_adjust:    Korrektur für Einsatz/Vorteil: so viele Punkte pro überzähligem Ass im Rest
#                (überzählig = mehr Asse übrig als bei gleichmässiger Verteilung erwartet)

[systems.hi_lo]
name = "Hi-Lo"
balanced = true
level = 1
ace_side_count = false
values = { "2" = 1, "3" = 1, "4" = 1, "5" = 1, "6" = 1, "7" = 0, "8" = 0, "9" = 0, "10" = -1, "A" = -1 }

[systems.ko]
name = "KO (Knock-Out)"
balanced = false
level = 1
ace_side_count = false
values = { "2" = 1, "3" = 1, "4" = 1, "5" = 1, "6" = 1, "7" = 1, "8" = 0, "9" = 0, "10" = -1, "A" = -1 }
# Start-Count (IRC) = irc_per_deck * Decks + irc_offset  →  6 Decks: 4 − 24 = −20
irc_per_deck = -4
irc_offset = 4
# Feste Schwellen auf den Running Count (Standardwerte nach Vancura/Fuchs für 6 Decks)
key_count = -4         # ab hier lohnt sich ein höherer Einsatz
pivot = 4              # entspricht ungefähr einem True Count von +4 (unabhängig von der Schuhtiefe)
insurance = 3          # Versicherung ab Running Count +3
# Für die Umrechnung der Hi-Lo-Indizes in feste KO-Schwellen wird eine Referenztiefe
# angenommen: Anteil des Schuhs, der beim Entscheiden im Mittel schon gespielt ist.
reference_depth = 0.375

[systems.hi_opt_2]
name = "Hi-Opt II"
balanced = true
level = 2
ace_side_count = true
ace_adjust = 2
values = { "2" = 1, "3" = 1, "4" = 2, "5" = 2, "6" = 1, "7" = 1, "8" = 0, "9" = 0, "10" = -2, "A" = 0 }

[systems.omega_2]
name = "Omega II"
balanced = true
level = 2
ace_side_count = true
ace_adjust = 2
values = { "2" = 1, "3" = 1, "4" = 2, "5" = 2, "6" = 2, "7" = 1, "8" = 0, "9" = -1, "10" = -2, "A" = 0 }

[systems.zen]
name = "Zen Count"
balanced = true
level = 2
ace_side_count = false
values = { "2" = 1, "3" = 1, "4" = 2, "5" = 2, "6" = 2, "7" = 1, "8" = 0, "9" = 0, "10" = -2, "A" = -1 }

[systems.wong_halves]
name = "Wong Halves"
balanced = true
level = 1.5
ace_side_count = false
values = { "2" = 0.5, "3" = 1, "4" = 1, "5" = 1.5, "6" = 1, "7" = 0.5, "8" = 0, "9" = -0.5, "10" = -1, "A" = -1 }
