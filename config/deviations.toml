# --- Fab 4 (Late Surrender) --------------------------------------------

[[deviation]]
name = "14 gegen 10 aufgeben"
hand = "hard 14"
dealer = "10"
index = 3
when = ">="
action = "surrender"
else = "no_surrender"
group = "Fab4"

[[deviation]]
name = "15 gegen 10 aufgeben"
