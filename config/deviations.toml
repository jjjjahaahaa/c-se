# Abweichungen von der Basic Strategy abhängig vom Count (Index-Spiele).
#
# Mitgeliefert: Illustrious 18 und Fab 4 (Surrender) für Hi-Lo, mehrere Decks, S17
# (Don Schlesinger, "Blackjack Attack"). Für andere ausgeglichene Systeme wird der Index mit
# dem index_factor des Systems umgerechnet, für KO in eine feste Running-Count-Schwelle
# (siehe counting/systems.py). Eigene Indizes pro System können unten unter
# [overrides.<system>] eingetragen werden.
#
# Felder:
#   hand      "hard 16", "soft 18", "pair 10" oder "insurance"
#   dealer    Upcard des Dealers ("2".."10", "A")
#   index     Hi-Lo True Count
#   when      ">=" → Aktion, wenn TC >= index   "<" → Aktion, wenn TC < index
#   action    stand / hit / double / split / surrender / insurance
#   else      optional: Aktion, wenn die Bedingung NICHT erfüllt ist ("no_surrender" =
#             nicht aufgeben, normal weiterspielen). Ohne Angabe: Basic Strategy.

[[deviation]]
name = "Versicherung"
hand = "insurance"
dealer = "A"
index = 3
when = ">="
action = "insurance"
group = "I18"

[[deviation]]
name = "16 gegen 10 stehen"
hand = "hard 16"
dealer = "10"
index = 0
when = ">="
action = "stand"
group = "I18"

